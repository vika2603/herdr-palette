# Cuts a release of the version herdr-plugin.toml names: builds an archive for
# every supported platform, tags the commit the workflow runs on, and publishes
# the archives with a checksums.txt beside them.
#
# Nothing is committed here. The version is bumped by a commit of its own
# before the workflow is dispatched, so the branch never moves under a local
# checkout, and the build scripts verify a download against the checksums.txt
# of the same release.
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the version and refuse an existing tag
        id: read
        run: |
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' herdr-plugin.toml | head -1)
          if [ -z "$version" ]; then
            echo "herdr-plugin.toml names no version" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "v${version} already exists; bump the version in herdr-plugin.toml first" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  build:
    needs: [version, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        # The archive holds the binary under the name it runs as, and keeps its
        # executable bit, which upload-artifact would drop from a bare file.
        # Windows gets a zip, which its PowerShell unpacks with nothing added.
        run: |
          mkdir -p build dist
          if [ "$GOOS" = windows ]; then
            go build -trimpath -o build/palette.exe ./cmd/palette
            (cd build && zip -q "../dist/palette-${GOOS}-${GOARCH}.zip" palette.exe)
          else
            go build -trimpath -o build/palette ./cmd/palette
            tar -czf "dist/palette-${GOOS}-${GOARCH}.tar.gz" \
              --owner=0 --group=0 --numeric-owner -C build palette
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: palette-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/palette-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Record the checksums
        run: |
          (cd dist && sha256sum palette-*) > dist/checksums.txt
          cat dist/checksums.txt
      - name: Tag and release
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "Command Palette ${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" \
            --title "Command Palette ${VERSION}" \
            --generate-notes \
            dist/palette-* dist/checksums.txt
