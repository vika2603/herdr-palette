# A command palette for herdr: one popup that searches every action and runs it.
# One binary serves every entrypoint declared here; plugin.Env tells the process
# which one started it. See docs/design.md.

id = "herdr.palette"
name = "Command Palette"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Search and run herdr actions and plugin actions from one popup"
platforms = ["linux", "macos"]

[[build]]
command = ["./scripts/build.sh"]

# herdr draws a pane's title on the border and its manifest requires one, so
# every pane here carries a zero-width space: it passes the check and leaves
# the border with nothing on it. What a pane is showing is inside it, where
# there is room to say it properly.
# A popup is centred in the pane area, so its height is also what decides how
# high up it starts. The width leaves the list room for its columns beside the
# preview. The plugin's configuration replaces both under [window].
[[panes]]
id = "palette"
title = "\u200B"
description = "Search and run an action"
placement = "popup"
width = "80%"
height = "60%"
command = ["./bin/palette"]

# The field an entry that needs a value is collected in: two lines, in a popup
# of its own rather than in the palette's window.
[[panes]]
id = "input"
title = "\u200B"
description = "Collect the value a command needs"
placement = "popup"
width = "40%"
height = 3
command = ["./bin/palette"]

[[panes]]
id = "run"
title = "\u200B"
description = "Run a command configured under [[keys.command]]"
# Placement and size come from the command's own configuration, passed when the
# pane is opened.
placement = "popup"
command = ["./bin/palette"]

# Opens the popup, from a key that also closes it. herdr hands every key to a
# popup while one is up, so the closing half is the popup's own: it quits when
# the key bound to this action arrives inside it.
[[actions]]
id = "toggle"
title = "Toggle command palette"
description = "Open the command palette, or close it when it is open"
contexts = ["global", "workspace", "tab", "pane"]
command = ["./bin/palette"]

# The same popup, opened with its query already narrowed to what is open. Bound
# to a key of its own it reaches a pane by name with no commands in the way.
[[actions]]
id = "goto"
title = "Go to an open pane"
description = "Search the open panes of the session and go to one"
contexts = ["global", "workspace", "tab", "pane"]
command = ["./bin/palette"]

# Goes straight to the last place the palette went to, with no popup in
# between. What it returns to is whatever pane the recent order holds first.
[[actions]]
id = "back"
title = "Go back to the last place"
description = "Focus the pane the palette last went to"
contexts = ["global", "workspace", "tab", "pane"]
command = ["./bin/palette"]

# Goes to an agent that is blocked, or failing that done, with no popup in
# between; pressed again from one it goes to the next one waiting. The pane it
# is pressed in becomes what back returns to.
[[actions]]
id = "attend"
title = "Go to an agent that needs you"
description = "Focus the next agent that is blocked or done"
contexts = ["global", "workspace", "tab", "pane"]
command = ["./bin/palette"]

# Runs a command the popup handed over. herdr runs an action outside the popup,
# which is what lets a relayed command open a popup of its own.
[[actions]]
id = "exec"
title = "Run the handed-over command"
description = "Internal: runs what the palette could not run from inside its popup"
contexts = ["global"]
command = ["./bin/palette"]
